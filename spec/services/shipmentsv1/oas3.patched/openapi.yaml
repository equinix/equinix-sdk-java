  "definitions": {
    "pending-storage-request": {
      "title": "Pending Storage Request",
      "type": "object",
      "properties": {
        "shipmentDetails": {
          "type": "array",
          "items": {
            "type": "object",
            "properties": {
              "storageId": {
                "type": "string"
              },
              "cage": {
                "type": "string"
              },
              "accountNumber": {
                "type": "string"
              },
              "deliverToCage": {
                "type": "boolean"
              },
              "additionalDetails": {
                "type": "string",
                "description": "Scope of work",
                "minLength": 1,
                "maxLength": 4000
              },
              "customerReferenceNumber": {
                "description": "You may use numbers and text in this field to enter reference information for your records. This will also appear in your reports and details. You may use this information to search for this content on the submitted requests page.",
                "minLength": 1,
                "maxLength": 50,
                "example": "cust-ref-123"
              },
              "purchaseInformation": {
                "type": "string",
                "description": "Purchase Order Number",
                "example": "1234567890",
                "minLength": 1,
                "maxLength": 30
              }
            },
            "required": [
              "storageId",
              "cage",
              "accountNumber",
              "deliverToCage"
            ]
          }
        },
        "contacts": {
          "type": "array",
          "minItems": 1,
          "items": {
            "$ref": "#/definitions/contactInfo"
          }
        }
      },
      "required": [
        "shipmentDetails",
        "contacts"
      ],
      "example": {
        "contacts": [
          {
            "contactType": "ORDERING",
            "userName": "jondoe@test.com"
          },
          {
            "contactType": "NOTIFICATION",
            "userName": "jondoe@test.com"
          }
        ],
        "shipmentDetails": [
          {
            "storageId": "1-275PQCAS",
            "cage": "CH1:05:313",
            "deliverToCage": true,
            "accountNumber": "133333"
          },
          {
            "storageId": "1-275PQCGBF",
            "cage": "SV1:05:31113",
            "deliverToCage": false,
            "accountNumber": "133335"
          }
        ]
      }
    },
    "pending-storage-order-response": {
      "title": "Pending Storage Order Response",
      "type": "array",
      "items": {
        "type": "object",
        "properties": {
          "OrderReferenceId": {
            "type": "string",
            "description": "Order Reference Id"
          },
          "orderNumber": {
            "type": "string",
            "description": "Order Number",
            "example": "1-108124419634"
          },
          "Id": {
            "type": "string",
            "description": "Order Id"
          },
          "SRNumber": {
            "type": "string",
            "description": "SR Number"
          },
          "storageID": {
            "type": "string"
          },
          "Ibx": {
            "type": "string"
          },
          "cage": {
            "type": "string"
          },
          "accountNumber": {
            "type": "string"
          },
          "trackingNumber": {
            "type": "string"
          }
        },
        "required": [
          "orderNumber",
          "storageID",
          "Ibx",
          "cage",
          "accountNumber",
          "trackingNumber"
        ]
      }
    },
    "outboundServiceDetail": {
      "title": "Outbound Service Detail",
      "type": "object",
      "properties": {
        "outboundRequestDescription": {
          "type": "string",
          "minLength": 1,
          "maxLength": 4000
        },
        "estimatedDateTime": {
          "type": "string",
          "description": "Date and time of received event (ISO Date)<br> Cannot in Past. ",
          "format": "date-time"
        },
        "shipmentDetails": {
          "type": "object",
          "required": [
            "outboundType"
          ],
          "properties": {
            "outboundType": {
              "type": "string",
              "enum": [
                "CARRIER",
                "CUSTOMER_CARRY"
              ],
              "description": "Outbound Type",
              "example": "CARRIER"
            },
            "carrierName": {
              "type": "string",
              "enum": [
                "UPS",
                "FEDEX",
                "DHL",
                "OTHER"
              ]
            },
            "trackingNumber": {
              "type": "string",
              "minLength": 1,
              "maxLength": 100
            },
            "noOfBoxes": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100000,
              "exclusiveMaximum": false
            },
            "declaredValue": {
              "type": "string",
              "minLength": 1,
              "maxLength": 20
            },
            "labelExists": {
              "type": "boolean"
            },
            "shipToAddress": {
              "type": "object",
              "properties": {
                "name": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 100
                },
                "address": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 100
                },
                "city": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 100
                },
                "state": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 100
                },
                "country": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 100
                },
                "zipCode": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 100
                },
                "phoneNumber": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 20
                },
                "carrierAccountNumber": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 100
                }
              },
              "required": [
                "name",
                "address",
                "city",
                "state",
                "country",
                "zipCode",
                "phoneNumber",
                "carrierAccountNumber"
              ]
            },
            "otherCarrierName": {
              "type": "string",
              "minLength": 1,
              "maxLength": 50
            },
            "uploadedLabel": {
              "$ref": "#/definitions/attachment"
            },
            "insureShipment": {
              "type": "boolean"
            },
            "pickUpFromCageSuite": {
              "type": "boolean"
            },
            "description": {
              "type": "string",
              "minLength": 1,
              "maxLength": 100
            }
          }
        }
      },
      "required": [
        "estimatedDateTime",
        "shipmentDetails"
      ]
    },
    "clientError": {
      "title": "Client Error",
      "type": "array",
      "items": {
        "$ref": "#/definitions/clientErrorType"
      }
    },
    "serverError": {
      "title": "Server Error",
      "type": "array",
      "items": {
        "$ref": "#/definitions/serverErrorType"
      }
    },
    "shipment-order-response": {
      "title": "Shipment Order Response",
      "type": "object",
      "properties": {
        "OrderReferenceId": {
          "type": "string",
          "description": "Order Reference Id"
        },
        "orderNumber": {
          "type": "string",
          "description": "Order Number",
          "example": "1-108124419634"
        },
        "Id": {
          "type": "string",
          "description": "Order Id"
        },
        "SRNumber": {
          "type": "string",
          "description": "SR Number"
        }
      },
      "required": [
        "orderNumber"
      ]
    },
    "ibxLocation": {
      "title": "ibxLocation",
      "type": "object",
      "properties": {
        "ibx": {
          "type": "string",
          "minLength": 1,
          "maxLength": 10
        },
        "cages": {
          "type": "array",
          "minItems": 1,
          "items": {
            "type": "object",
            "properties": {
              "cage": {
                "type": "string",
                "minLength": 1
              },
              "accountNumber": {
                "type": "string"
              }
            },
            "required": [
              "cage",
              "accountNumber"
            ]
          }
        }
      },
      "required": [
        "ibx",
        "cages"
      ],
      "example": {
        "ibx": "PA2",
        "cages": [
          {
            "cage": "PA2:02:002MC1"
          }
        ]
      }
    },
    "price": {
      "title": "Price",
      "type": "object",
      "description": "The \"amount\" attribute denotes how much money the Purchase Order contains. This \"amount\" is measured in the currency type listed in the customer's account.",
      "properties": {
        "amount": {
          "type": "number",
          "description": "Price",
          "minimum": 0,
          "maximum": 999999999999999
        }
      }
    },
    "cage": {
      "title": "Cage",
      "type": "object",
      "properties": {
        "cage": {
          "type": "string",
          "description": "Cage",
          "example": "LD5:01:001MC3"
        },
        "cageTypes": {
          "type": "array",
          "description": "Cage Types",
          "example": "Shared",
          "items": {
            "type": "string"
          }
        },
        "accounts": {
          "type": "array",
          "description": "List of Accounts",
          "items": {
            "$ref": "#/definitions/account"
          }
        }
      },
      "required": [
        "cage"
      ]
    },
    "clientErrorType": {
      "title": "Client Error Type",
      "type": "object",
      "properties": {
        "code": {
          "type": "string",
          "example": "EQX-161-1234"
        },
        "message": {
          "type": "string",
          "example": "Input supplied is invalid"
        }
      },
      "required": [
        "code",
        "message"
      ]
    },
    "inboundServiceDetail": {
      "title": "Inbound Service Detail",
      "type": "object",
      "example": {
        "estimatedDateTime": "2018-10-15T05:00:00.420-08:00",
        "shipmentDetails": {
          "noOfBoxes": 10,
          "isOverSized": true,
          "description": "hello",
          "trackingNumber": [
            "1235467869",
            "1",
            "4",
            "5"
          ],
          "inboundType": "CARRIER",
          "carrierName": "OTHER",
          "otherCarrierName": "test"
        },
        "deliverToCage": true,
        "inboundRequestDescription": "hello"
      },
      "properties": {
        "shipmentDetails": {
          "type": "object",
          "required": [
            "noOfBoxes",
            "inboundType"
          ],
          "properties": {
            "noOfBoxes": {
              "type": "integer",
              "description": "No of boxes",
              "maximum": 10000000000000000000
            },
            "isOverSized": {
              "type": "boolean",
              "description": "if Box is oversized",
              "example": true
            },
            "description": {
              "type": "string",
              "description": "description of inbound shipment",
              "minLength": 1,
              "maxLength": 100
            },
            "trackingNumber": {
              "type": "array",
              "minItems": 0,
              "maxItems": 10,
              "description": "Tracking number",
              "example": "1,2,3",
              "items": {
                "type": "string",
                "minLength": 0,
                "maxLength": 100
              }
            },
            "inboundType": {
              "type": "string",
              "enum": [
                "CARRIER",
                "CUSTOMER_CARRY"
              ],
              "description": "Inbound Type",
              "example": "CARRIER"
            },
            "carrierName": {
              "type": "string",
              "enum": [
                "FEDEX",
                "DHL",
                "UPS",
                "OTHER"
              ],
              "description": "Carrier Name of shipment",
              "example": "FEDEX"
            },
            "otherCarrierName": {
              "type": "string",
              "description": "Other Carrier Name",
              "minLength": 1,
              "maxLength": 50
            }
          }
        },
        "deliverToCage": {
          "type": "boolean",
          "description": "Deliver To cage",
          "example": true
        },
        "inboundRequestDescription": {
          "type": "string",
          "description": "Scope of work",
          "minLength": 1,
          "maxLength": 4000
        },
        "storageId": {
          "type": "string",
          "description": "Storage ID",
          "example": 123
        },
        "estimatedDateTime": {
          "type": "string",
          "format": "date-time",
          "description": "estimatedDateTime of Shipment (ISO Date)<br> Cannot in Past. ",
          "example": "2018-10-15T05:00:00.420-08:00"
        }
      },
      "required": [
        "shipmentDetails",
        "estimatedDateTime"
      ]
    },
    "genericErrorType": {
      "title": "Generic Error Type",
      "type": "object",
      "properties": {
        "code": {
          "type": "string",
          "example": "EQX-161-403/500"
        },
        "message": {
          "type": "string",
          "example": "Error message"
        }
      },
      "required": [
        "code",
        "message"
      ]
    },
    "attachment": {
      "title": "Attachment",
      "type": "object",
      "properties": {
        "id": {
          "type": "string",
          "description": "Attachment ID",
          "minLength": 1,
