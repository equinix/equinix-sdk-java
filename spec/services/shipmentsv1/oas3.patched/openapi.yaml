    "/v1/orders/shipment/locations": {
      "get": {
        "operationId": "getLocation",
        "summary": "Get Locations(ibx, cage) Details for Shipment  Based on Place Shipment Permission for User",
        "tags": [
          "Shipment"
        ],
        "description": "This API is use to check user's permission's & access to ibx",
        "parameters": [
          {
            "name": "detail",
            "in": "query",
            "description": "When enable this flag returns detailed permission with Cage & Cabinets. Default value is false",
            "required": false,
            "type": "boolean"
          },
          {
            "name": "ibxs",
            "in": "query",
            "required": false,
            "type": "string"
          },
          {
            "name": "cages",
            "in": "query",
            "required": false,
            "type": "string"
          }
        ],
        "responses": {
          "200": {
            "description": "Return list of Ibx, Cage, Cabinets where user has access",
            "schema": {
              "type": "object",
              "properties": {
                "locations": {
                  "type": "array",
                  "items": {
                    "$ref": "#/definitions/location"
                  }
                }
              }
            },
            "examples": {
              "application/json": {
                "locations": [
                  {
                    "ibx": "AM1",
                    "cages": [
                      {
                        "cage": "AM1:02:002MC1",
                        "cageTypes": [
                          "Shared"
                        ],
                        "accounts": [
                          {
                            "number": "1111",
                            "name": "ABC Network Services",
                            "isCreditHold": false,
                            "isPOBearing": true,
                            "isMonetAccount": false,
                            "cabinets": [
                              {
                                "cabinet": "AM1:02:002MC1:0601",
                                "cabinetType": "Shared"
                              },
                              {
                                "cabinet": "AM1:02:002MC1:0602",
                                "cabinetType": "Shared"
                              }
                            ]
