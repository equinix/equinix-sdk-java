          type: string
          description: This field will be deprecated in the future.
          example: flex
        licenseFileId:
          type: string
          description: "For Juniper devices you need to provide a licenseFileId if\
            \ you want to BYOL (Bring Your Own License). You get a licenseFileId when\
            \ you upload a license file by calling license upload API (Upload a license\
            \ file before creating a virtual device). For Cisco devices, you do not\
            \ need to provide a licenseFileId at the time of device creation. Once\
            \ the device is provisioned, you can get the deviceSerialNo by calling\
            \ Get virtual device {uuid} API. With the deviceSerialNo you can generate\
            \ a license file on Cisco site. Afterward, you can upload the license\
            \ file by calling license upload API (Upload a license file after creating\
            \ a virtual device)."
          example: d6e21e0c-86dd-11e8-adc0-fa7ae01bbebc
        licenseToken:
          type: string
          description: "In case you want to BYOL (Bring Your Own License) for a Palo\
            \ Alto device, you must provide a license token. This field must have\
            \ 8 alphanumeric characters."
          example: V74191621
        day0TextFileId:
          type: string
          description: Some devices require a day0TextFileId. Upload your license
            file by calling Upload File API. You'll get a fileUuid in the response.
            You can enter the value in the day0TextFileId field of the create payload
            to create a virtual device. Check the payloads of individual devices (provided
            as Postman Scripts on our API doc site) for details.
          example: 4cfb5675-5c3f-4275-adba-0c9e3c26c96b
        termlength:
          type: string
          description: Term length in months.
          example: "12"
        metroCode:
          type: string
          description: Metro code
          example: SV
        packageCode:
          type: string
          description: Software package code
          example: IPBASE
        sshUsers:
          type: array
          description: An array of sshUsernames and passwords
          items:
            $ref: '#/components/schemas/SshUsers'
