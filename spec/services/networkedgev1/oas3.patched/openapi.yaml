        activationKey:
          type: string
          description: Activation key
          example: GJUK-JM2X-59BJ-2TDJ
        controllerFqdn:
          type: string
          description: Controller FQDN
          example: demo.velocloud.net
        rootPassword:
          type: string
          description: Root password
          example: myPassw0rd!
        accountName:
          type: string
          description: The name of account.
          example: accountName
        hostname:
          type: string
          description: The host name.
          example: myHostname
        accountKey:
          type: string
          description: The account key.
          example: Primary Account Key1
        applianceTag:
          type: string
          description: The appliance tag.
          example: applianceTag
        userName:
          type: string
          description: This field is rel
