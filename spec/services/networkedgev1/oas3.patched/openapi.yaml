      summary: Get Downloadable Images
      description: Returns the downloadable images of a device type. Pass any device
        type as a path parameter to get the list of downloadable images.
      operationId: getDownloadableImagesByDeviceType
      parameters:
        - name: deviceType
          in: path
          description: Device type
          required: true
