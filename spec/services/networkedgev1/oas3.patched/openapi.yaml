      summary: Download an Image
      description: Returns a link to download image. You need to provide a device
        type and version as path parameters.
      operationId: getDownloadImageByDeviceType
      parameters:
        - name: deviceType
          in: path
          description: Device type
          required: true
          example: C8000V
          schema:
            $ref: '#/components/schemas/DeviceTypeCode'
        - name: version
          in: path
          description: Version
          required: true
