      description: Checks the feasibility of restoring the backup of a virtual device.
        Authorization checks are performed on the users of this API.
      operationId: checkRestoreAnalysisOfBackupByUuid
      parameters:
        - name: uuid
          in: path
          example: 3da0a663-20d9-4b8f-8c5d-d5cf706840c8
          description: Unique ID of a device
          required: true
          schema:
            type: string
        - name: backupUuid
          in: query
          description: Unique ID of a backup
          example: 4cfb5675-5c3f-4275-adba-0c9e3c26c96b
          required: false
          schema:
            type: string

      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreBackupInfoVerbose'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
  /ne/v1/devices/{uuid}/restore:
    patch:
      tags:
        - Device-Backup-and-Restore
      summary: Restores a backup
      description: Restores any backup of a device. Authorization checks are performed
        on users of this API.
      operationId: restoreDeviceBackupByUuid
      parameters:
        - name: uuid
          in: path
          description: Unique ID of a backup
          required: true
          example: 4cfb5675-5c3f-4275-adba-0c9e3c26c96b
          schema:
            type: string

      requestBody:
        description: Update device backup
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceBackupUpdateRequest'
        required: true
      responses:
        "204":
          description: The backup was successfully restored
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
      x-codegen-request-body-name: request
  /ne/v1/devices/{virtualDeviceUuid}/rma:
    post:
      tags:
        - Device-RMA
      summary: Trigger Device RMA
      description: Triggers a request to create an RMA of a device. The payload to
        create an RMA is different for different vendors. You will need to enter a
        license to create an RMA.
      operationId: createDeviceRMAByUuid
      parameters:
        - name: virtualDeviceUuid
          in: path
          description: Unique ID of a device
          required: true
          example: 877a3aa2-c49a-4af1-98a6-007424e737ae
          schema:
            type: string

      requestBody:
        description: Post RMA request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRMAPostRequest'
        required: true
      responses:
        "204":
          description: You successfully triggered an RMA request.
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldErrorList"
        "403":
          description: Forbidden
          content:
            application/json:
