          type: integer
          description: "Numeric throughput. For Cisco8KV self-configured devices,\
            \ you can choose either numeric or tier throughput options."
          format: int32
          example: 1
        throughputUnit:
          type: string
          description: Throughput unit.
          example: Gbps
        tier:
          type: integer
          description: "Tier throughput. Relevant for Cisco8KV devices. For Cisco8KV\
            \ self-configured devices, you can choose either numeric or tier throughput\
            \ options. Possible values - 0, 1, 2, 3. Default - 2"
          example: 1
        virtualDeviceName:
          type: string
          description: Virtual device name for identification. This should be minimum
            3 and maximum 50 characters long.
          example: Router1-c8000v
        orderingContact:
          type: string
          description: Username of the ordering contact.
          example: subuser01
        notifications:
          type: array
          description: Email addresses for notification. We need a minimum of 1 and
