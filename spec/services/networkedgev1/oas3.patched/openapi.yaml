          example: "209809"
        projectId:
          type: string
          description: Customer project Id. Check your projectId under Resource Management
            on Equinix Portal. You should have access to a project to see or create
            assets under it. Equinix will assign a projectId if you do not provide
            one.
          example: XXXX-XXXX-XXXXX-XXXXXXXXXXXXXXXX
        version:
          type: string
          description: Version.
          example: 16.09.03
        deviceTypeCode:
          $ref: '#/components/schemas/DeviceTypeCode'
        hostNamePrefix:
          type: string
          description: "Host name prefix for identification. Only a-z, A-Z, 0-9, and\
