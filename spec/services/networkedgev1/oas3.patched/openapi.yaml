    VendorTermsResponse:
      type: object
      description: Response containing vendor terms
      properties:
        terms:
          type: string
          description: Vendor terms URL
          example: https://www.cisco.com/c/en/us/about/legal/cloud-and-software/end_user_license_agreement.html
    DeviceLinkRequest:
      required:
        - groupName
        - subnet
      type: object
      properties:
        groupName:
          type: string
          description: Group name.
          example: linkGroup
        subnet:
          type: string
          description: Subnet of the link group.
          example: 192.164.0.0/29
        redundancyType:
          type: string
          description: Whether the connection should be created through Fabric's primary
            or secondary port.
          enum:
            - PRIMARY
            - SECONDARY
          example: SECONDARY
        linkDevices:
          type: array
          description: An array of devices to link.
          example:
            - deviceUuid: 9ea5a0e4-2bf7-45c2-9aa7-e846a8cd5560
              asn: 1007
              interfaceId: 7
            - deviceUuid: 8ea5a0e4-2bf7-45c2-9aa7-e846a8cd5561
              asn: 2006
              interfaceId: 6
          items:
            $ref: '#/components/schemas/LinkDeviceInfo'
        metroLinks:
          type: array
          description: An array of links.
          items:
            $ref: '#/components/schemas/LinkInfo'
    LinkDeviceResponse:
      type: object
      properties:
        deviceUuid:
          type: string
          description: A device that is part of the device linked group
          example: 8ea5a0e4-2bf7-45c2-9aa7-e846a8cd5561
        deviceName:
          type: string
          description: Device name
          example: Cisco Router1
        metroCode:
          type: string
          description: Metro Code
          example: DA
        metroName:
          type: string
          description: Name of the metro.
          example: Dallas
        deviceTypeCode:
          $ref: '#/components/schemas/DeviceTypeCode'
        category:
          type: string
          description: Device category
          enum:
            - ROUTER
            - FIREWALL
            - SDWAN
          example: ROUTER
        ipAssigned:
          type: string
          description: Assigned IP address
          example: 10.0.0.2/27
        interfaceId:
          type: integer
          description: Interface ID
          example: 6
        status:
          type: string
          description: The status of the device
          enum:
            - PROVISIONED
            - PROVISIONING
            - DEPROVISIONED
            - DEPROVISIONING
            - FAILED
          example: PROVISIONING
        deviceManagementType:
          type: string
          description: Device management type
          enum:
            - SELF-CONFIGURED
            - EQUINIX-CONFIGURED
          example: EQUINIX-CONFIGURED
        networkScope:
          type: string
          description: Network scope
          example: TENANT
        isDeviceAccessible:
          type: boolean
          description: Whether the device is accessible
          example: true
    LinkInfo:
      type: object
      properties:
        accountNumber:
          type: string
          description: Account number. Either an account number or an accountreferenceId
            is required to create a link group.
          example: "345678"
        throughput:
          type: string
          description: Metro Throughput.
          example: "1000"
        throughputUnit:
          type: string
          description: Throughput unit.
          example: Mbps
        metroCode:
          type: string
          description: Metro you want to link.
          example: SY
    LinkDeviceInfo:
      required:
        - deviceUuid
      type: object
      properties:
        asn:
          type: integer
          description: The ASN number of the device. The request will fail if you
            provide a new ASN for a device that already has an ASN.
          format: int64
          example: 25658
        deviceUuid:
          type: string
          description: device
          example: 70754e55-a064-40c3-a911-6dc1f14b96fd
        interfaceId:
          type: integer
          description: Any available interface of the device.
          example: 6
      description: Unique Id of a device.
    LinkInfoResponse:
      type: object
      properties:
        accountName:
          type: string
          description: Account name
          example: Equinix
        metroCode:
          type: string
          description: Linked metro code
          example: SY
        metroName:
          type: string
          description: Linked metro name
          example: Singapore
        throughput:
          type: string
          description: Metro Throughput.
          example: "1000"
        throughputUnit:
          type: string
          description: Throughput unit.
          example: Mbps
    DeviceLinkGroupResponse:
      type: object
      description: Response containing device link group UUID
      properties:
        uuid:
          type: string
          description: Unique ID of the device link group
          example: a5d9182d-c529-451d-b137-3742d5a742ce
    DeviceLinkGroup:
      type: object
      properties:
        uuid:
          type: string
          description: Unique Id of the linked group.
          example: 6ea5a0e4-2bf7-45c2-9aa7-e846a8cd5567
        groupName:
          type: string
          description: The name of the linked group
          example: my-new-link
        subnet:
          type: string
          description: Subnet of the link group.
          example: 10.0.0.0/27
        redundancyType:
          type: string
          description: Whether the connection is through Fabric's primary or secondary
            port.
          enum:
            - PRIMARY
            - SECONDARY
          example: SECONDARY
        status:
          type: string
          description: Status of the linked group
          enum:
            - PROVISIONED
            - PROVISIONING
            - DEPROVISIONED
            - DEPROVISIONING
            - FAILED
          example: PROVISIONING
        createdBy:
          type: string
          description: Created by username.
          example: nfv-sit1
        createdDateTime:
          type: string
          format: date-time
          description: Created date.
          example: 2019-09-15T10:30:31Z
        lastUpdatedBy:
          type: string
          description: Last updated by user
          example: reg2-acc1
        lastUpdatedDateTime:
          type: string
          format: date-time
          description: Last updated date
          example: 2019-09-16T10:30:31Z
        metroLinks:
          type: array
          description: An array of links between metros.
          items:
            $ref: '#/components/schemas/LinkInfoResponse'
        linkDevices:
          type: array
          description: An array of metros and the devices in the metros belonging
            to the group.
          example:
            - deviceUuid: 4cfb5675-5c3f-4275-adba-0c9e3c26c96b
              deviceName: Cisco Router1
              metroCode: DA
              metroName: Dallas
              deviceTypeCode: C8000V
              category: ROUTER
              ipAssigned: 10.0.0.0/27
              interfaceId: 5
              status: PROVISIONING
              deviceManagementType: SELF-CONFIGURED
              networkScope: TENANT
              isDeviceAccessible: true
            - deviceUuid: 5cfb5675-5c3f-4275-adba-0c9e3c26c96c
              deviceName: Cisco Router2
              metroCode: DA
              metroName: Dallas
              deviceTypeCode: C8000V
              category: ROUTER
              ipAssigned: 10.0.0.0/27
              interfaceId: 5
              status: PROVISIONING
              deviceManagementType: SELF-CONFIGURED
              networkScope: TENANT
              isDeviceAccessible: true
          items:
            $ref: '#/components/schemas/LinkDeviceResponse'
    VendorConfig:
      type: object
