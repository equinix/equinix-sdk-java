                $ref: '#/components/schemas/FieldErrorList'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
      x-codegen-request-body-name: request
  /ne/v1/devices/{deviceType}/repositories:
    get:
      tags:
