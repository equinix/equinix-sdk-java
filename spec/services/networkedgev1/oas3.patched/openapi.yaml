openapi: 3.0.3
info:
  title: Network Edge APIs
  description: "Network Edge (NE) is a platform for deploying and running virtual\
    \ network services and appliances such as routers, load balancers, and firewalls\
    \ on generic hardware. This eliminates the need for dedicated hardware, upfront\
    \ capital expenditure (CapEx), and colocation space. Use these REST APIs to programmatically\
    \ create virtual devices, add services, and manage your network infrastructure\
    \ on the Equinix Platform."
  termsOfService: https://www.equinix.com/about/legal/terms
  license:
    name: Equinix Inc
    url: https://developer.equinix.com/agreement
  contact:
    name: Equinix API Support
    url: https://docs.equinix.com/api-support.htm
  version: 1.0.0
externalDocs:
  description: Find more information on Equinix Docs Portal
  url: https://docs.equinix.com/network-edge/
servers:
  - url: https://api.equinix.com
    description: Equinix Inc
security:
  - BearerAuth: []
tags:
  - name: Availability-and-Metros
    description: "APIs for infrastructure details such as device types, metros, and account information."
  - name: Virtual-Device
    description: "APIs for managing the lifecycle and configuration of virtual devices."
  - name: Device-Link-Groups-and-Connections
    description: "APIs for managing device link groups and connections between virtual devices."
  - name: Device-Backup-and-Restore
    description: "APIs for managing backups and restoration of virtual devices."
  - name: Download-Image
    description: "APIs for retrieving and managing virtual device images."
  - name: ACL Template
    description: "APIs for managing Access Control List (ACL) templates."
  - name: Device-RMA
    description: "APIs for device maintenance activities such as Return Merchandise Authorization (RMA)."
paths:
  /ne/v1/deviceTypes:
    get:
      tags:
        - Availability-and-Metros
      summary: List Device Types
      description: "Returns device types (e.g., routers and firewalls) that can be\
        \ launched on the NE platform."
      operationId: getVirtualDeviceTypes
      parameters:
        - name: deviceTypeCode
          in: query
          description: "Device type code (e.g., C8000V)"
          example: C8000V
          required: false
          schema:
            $ref: '#/components/schemas/DeviceTypeCode'
        - name: category
          in: query
          description: "Category. One of FIREWALL, ROUTER or SD-WAN"
          example: ROUTER
          required: false
          schema:
            type: string
        - name: offset
          in: query
          description: Specifies where to start a page. It is the starting point of
            the collection returned from the server.
          example: 0
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: limit
          in: query
          description: Specifies the page size.
          example: 20
          required: false
          schema:
            type: integer
            format: int32
            default: 20
        - name: projectId
          in: query
          required: false
          description: "If projectId is different from default projectId, must pass a projectId parameter"
          example: "3da0a663-20d9-4b8f-8c5d-d5cf706840c8"
          schema:
            type: string

      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDeviceTypesResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
  /ne/v1/deviceTypes/{deviceType}/interfaces:
    get:
      tags:
        - Availability-and-Metros
      summary: List Allowed Interfaces
      description: Returns the interface details for a device type with a chosen configuration.
        You must pass the device type as the path parameter.
      operationId: getAllowedInterfaces
      parameters:
        - name: deviceType
          in: path
          description: Device type code. PA-VM.
          example: PA-VM
          required: true
          schema:
            $ref: '#/components/schemas/DeviceTypeCode'
        - name: deviceManagementType
          in: query
          description: Device management type. SELF-CONFIGURED
          example: SELF-CONFIGURED
          required: true
          schema:
            type: string
            enum:
              - SELF-CONFIGURED
              - EQUINIX-CONFIGURED
        - name: mode
          in: query
          required: false
          description: "License mode, either Subscription or BYOL."
          example: Subscription
          schema:
            type: string
            enum:
              - Subscription
              - BYOL
        - name: cluster
          in: query
          required: false
          description: Whether you want a cluster device.
          example: false
          schema:
            type: boolean
        - name: sdwan
          in: query
          required: false
          description: Whether you want an SD-WAN device.
          example: false
          schema:
            type: boolean
        - name: connectivity
          in: query
          required: false
          description: "Type of connectivity you want. INTERNET-ACCESS, PRIVATE, or INTERNET-ACCESS-WITH-PRVT-MGMT. PRIVATE devices do not have ACLs or bandwidth."
          example: INTERNET-ACCESS
          schema:
            type: string
            enum:
              - INTERNET-ACCESS
              - PRIVATE
              - INTERNET-ACCESS-WITH-PRVT-MGMT
        - name: core
          in: query
          required: false
          description: The desired number of cores.
          example: 4
          schema:
            type: integer
        - name: memory
          in: query
          required: false
          description: Desired memory.
          example: 4
          schema:
            type: integer
        - name: unit
          in: query
          required: false
          description: Unit of memory. GB or MB.
          example: GB
          schema:
            type: string
        - name: flavor
          in: query
          required: false
          description: Flavor of device.
          example: small
          schema:
            type: string
        - name: version
          in: query
          required: false
          description: Version.
          example: 17.06.01
          schema:
            type: string
        - name: softwarePkg
          in: query
          required: false
          description: Software package.
          example: SEC
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllowedInterfaceResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
  /ne/v1/metros:
    get:
      tags:
        - Availability-and-Metros
      summary: List Available Metros
      description: Gets the available list of metros where NE platform is available.
        Please note that an account must be created for each country where virtual
        devices are being purchased.
      operationId: getMetros
      parameters:
        - name: region
          in: query
          required: false
          description: "Name of the region for which you want metros (e.g., AMER)"
          example: AMER
          schema:
            type: string
        - name: offset
          in: query
          required: false
          description: Specifies where to start a page. It is the starting point of
            the collection returned from the server.
          example: 0
          schema:
            type: integer
            format: int32
            default: 0
        - name: limit
          in: query
          required: false
          description: Specifies the page size.
          example: 20
          schema:
            type: integer
            format: int32
            default: 20
            example: 10

      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMetrosResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
  /ne/v1/accounts/{metro}:
    get:
      tags:
        - Availability-and-Metros
      summary: List Accounts by Metro
      description: Gets accounts by metro. You must have an account in a metro to
        create a virtual device there. To create an account go to "accountCreateUrl".
      operationId: getAccountsWithStatus
      parameters:
        - name: metro
          in: path
          description: Metro region for which you want to check your account status
          example: SV
          required: true
          schema:
            type: string
        - name: accountUcmId
          in: query
          required: false
          description: Unique ID of an account
          example: 92D27009-EA33-4b60-B4FB-D3C4ED589649
          schema:
            type: string

      responses:
        "200":
          description: Successfully retrieved the account details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseMetroAccountResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
  /ne/v1/agreements/accounts:
    get:
      tags:
        - Availability-and-Metros
      summary: Get Agreement Status
      description: "Call this API to find out the status of your agreement, whether\
        \ it is valid or not, or to just read the agreement terms."
      operationId: getAgreementStatus
      parameters:
        - name: accountNumber
          in: query
          required: false
          description: Unique identifier of the customer account.
          example: "123456"
          schema:
            type: string

      responses:
        "200":
          description: Successfully retrieved Status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgreementStatusResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
    post:
      tags:
        - Availability-and-Metros
      summary: Create an agreement
      description: Call this API to post an agreement. The authorization token and
        content-type are the only headers that are passed to this API and a response
        is received based on the values passed.
      operationId: createAgreement
      requestBody:
        description: agreementAcceptRequest
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgreementAcceptRequest'
        required: true
      responses:
        "200":
          description: The request is fulfilled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgreementAcceptResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
      x-codegen-request-body-name: agreementAcceptRequest
  /ne/v1/agreements/vendors:
    get:
      tags:
        - Availability-and-Metros
      summary: Get Vendor Terms
      description: Returns a link to a vendor's terms. The term "vendor" refers to
        the vendor of a virtual device on the Network Edge platform.
      operationId: getVendorTerms
      parameters:
        - name: vendorPackage
          in: query
          required: false
          description: The vendor package code.
          example: NETWORK-ESSENTIALS
          schema:
            type: string
            enum:
              - VM02
              - VM03
              - NETWORK-ESSENTIALS
        - name: licenseType
          in: query
          required: false
          description: The type of license (e.g., Subscription, BYOL).
          example: Subscription
          schema:
            type: string
            enum:
              - Subscription
              - BYOL

      responses:
        "200":
          description: Successfully retrieved the vendor's terms
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorTermsResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
  /ne/v1/agreements/orders:
    get:
      tags:
        - Availability-and-Metros
      summary: Get Order Terms
      description: Retrieves the terms and conditions of orders. Please read the terms
        and conditions before placing an order.
      operationId: getOrderTerms
      responses:
        "200":
          description: Successfully retrieved Status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderTermsResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
  /ne/v1/prices:
    get:
      tags:
        - Availability-and-Metros
      summary: Calculate Price
      description: "Returns the price of a virtual device and license based on account\
        \ number and other fields. Please note that the listed price does not include\
        \ the price of any optional features added to the device, some of which are\
        \ charged."
      operationId: retrievePrice
      parameters:
        - name: accountNumber
          in: query
          required: false
          description: Account number
          example: 123456
          schema:
            type: integer
            format: int32
        - name: metro
          in: query
          required: false
          description: Metro
          example: SV
          schema:
            type: string
        - name: vendorPackage
          in: query
          required: false
          description: Vendor package
          example: NETWORK-ESSENTIALS
          schema:
            type: string
            enum:
              - VM02
              - VM03
              - NETWORK-ESSENTIALS
        - name: licenseType
          in: query
          required: false
          description: License type
          example: Subscription
          schema:
            type: string
            enum:
              - Subscription
              - BYOL
        - name: softwarePackage
          in: query
          description: Software package
          example: AX
          schema:
            type: string
        - name: throughput
          in: query
          required: false
          description: Throughput
          example: 100
          schema:
            type: integer
            format: int32
        - name: throughputUnit
          in: query
          required: false
          description: Throughput unit
          example: Mbps
          schema:
            type: string
        - name: termLength
          in: query
          required: false
          description: Term length (in months)
          example: "12"
          schema:
            type: string
        - name: additionalBandwidth
          in: query
          required: false
          description: Additional bandwidth (in Mbps)
          example: 100
          schema:
            type: integer
            format: int32
        - name: virtualDeviceUuid
          in: query
          required: false
          description: Virtual device unique Id (only required if existing device is
            being modified)
          example: 3da0a663-20d9-4b8f-8c5d-d5cf706840c8
          schema:
            type: string
        - name: deviceManagementType
          in: query
          required: false
          description: The device management type
          example: SELF-CONFIGURED
          schema:
            type: string
            enum:
              - SELF-CONFIGURED
              - EQUINIX-CONFIGURED
        - name: core
          in: query
          required: false
          description: The number of cores
          example: 4
          schema:
            type: integer
            format: int32
        - name: secondaryAccountNumber
          in: query
          required: false
          description: The secondary account number (for HA)
          example: 123457
          schema:
            type: integer
            format: int32
        - name: secondaryMetro
          in: query
          required: false
          description: Secondary metro (for HA)
          example: SV
          schema:
            type: string
        - name: secondaryAdditionalBandwidth
          in: query
          required: false
          description: Secondary additional bandwidth (in Mbps for HA)
          example: 100
          schema:
            type: integer
            format: int32
        - name: accountUcmId
          in: query
          required: false
          description: Account unique ID
          example: 92D27009-EA33-4b60-B4FB-D3C4ED589649
          schema:
            type: string
        - name: orderingContact
          in: query
          required: false
          description: Reseller customer username
          example: cust0001
          schema:
            type: string

      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompositePriceResponse'
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
  /ne/v1/orderSummaries:
    get:
      tags:
        - Availability-and-Metros
      summary: Get Order Summary
      description: Gets the order summary as a printable pdf file. This API helps
        customers who have to go through a PO process at their end to make a purchase
        and need a formal quote
      operationId: getOrderSummary
      parameters:
        - name: accountNumber
          in: query
          required: false
          description: Account number
          example: 123456
          schema:
            type: integer
            format: int32
        - name: metro
          in: query
          required: false
          description: Metro
          example: SV
          schema:
            type: string
        - name: vendorPackage
          in: query
          required: false
          description: Vendor package
          example: NETWORK-ESSENTIALS
          schema:
            type: string
            enum:
              - VM02
              - VM03
              - NETWORK-ESSENTIALS
        - name: licenseType
          in: query
          required: false
          description: License type
          example: Subscription
          schema:
            type: string
            enum:
              - Subscription
              - BYOL
        - name: softwarePackage
          in: query
          required: false
          description: Software package
          example: AX
          schema:
            type: string
        - name: throughput
          in: query
          required: false
          description: Throughput
          example: 100
          schema:
            type: integer
            format: int32
        - name: throughputUnit
          in: query
          required: false
          description: Throughput unit
          example: Mbps
          schema:
            type: string
        - name: termLength
          in: query
          required: false
          description: Term length (in months)
          example: "12"
          schema:
            type: string
        - name: additionalBandwidth
          in: query
          required: false
          description: Additional bandwidth (in Mbps)
          example: 100
          schema:
            type: integer
            format: int32
        - name: virtualDeviceUuid
          in: query
          required: false
          description: Virtual device unique Id (only required if existing device is
            being modified)
          example: 3da0a663-20d9-4b8f-8c5d-d5cf706840c8
          schema:
            type: string
        - name: deviceManagementType
          in: query
          required: false
          description: The device management type
          example: SELF-CONFIGURED
          schema:
            type: string
            enum:
              - SELF-CONFIGURED
              - EQUINIX-CONFIGURED
        - name: core
          in: query
          required: false
          description: The number of cores
          example: 4
          schema:
            type: integer
            format: int32
        - name: secondaryAccountNumber
          in: query
          required: false
          description: Secondary account number (in case you have a device pair)
          example: 123457
          schema:
            type: integer
            format: int32
        - name: secondaryMetro
          in: query
          required: false
          description: Secondary metro (in case you have a device pair)
          example: SV
          schema:
            type: string
        - name: secondaryAdditionalBandwidth
          in: query
          required: false
          description: Secondary additional bandwidth (in Mbps)
          example: 100
          schema:
            type: integer
            format: int32
        - name: accountUcmId
          in: query
          required: false
          description: Account unique ID
          example: 92D27009-EA33-4b60-B4FB-D3C4ED589649
          schema:
            type: string
        - name: orderingContact
          in: query
          required: false
          description: Reseller customer username
          example: cust0001
          schema:
            type: string

      responses:
        "200":
          description: "ContentType- application/pdf, charset UTF-8. The response\
            \ is a pdf file that you can save or view online."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
  /ne/v1/publicKeys:
    get:
      tags:
        - Availability-and-Metros
      summary: Get Public Keys
      description: "Returns the SSH public keys associated with this organization.\
        \ If you are a reseller, please pass the account number of you customer to\
        \ get the public keys."
      operationId: getPublicKeys
      parameters:
        - name: accountUcmId
          in: query
          required: false
          description: This field is for resellers. Please pass the accountUcmId of
            your customer to get the public keys.
          example: 92D27009-EA33-4b60-B4FB-D3C4ED589649
          schema:
            type: string
        - name: projectIds
          in: query
          required: false
          description: "If projectIds are different from default projectIds, must pass a projectIds parameter"
          example: "3da0a663-20d9-4b8f-8c5d-d5cf706840c8,3da0a663-20d9-4b8f-8c5d-d5cf706840c9"
          schema:
            type: string

      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPublicKeysResponse'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
    post:
      tags:
        - Availability-and-Metros
      summary: Create Public Key
      description: "Creates a public key. If you are a reseller, pass the account\
        \ number of your customer to create a key-name and key-value pair."
      operationId: postPublicKey
      requestBody:
        description: "keyName, keyValue, and keyType"
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicKeyRequest'
        required: true
      responses:
        "201":
          description: Created. The unique Id of the newly created key is in the location
            header of the response.
          headers:
            Location:
              description: URL of the created public key.
              example: /ne/v1/publicKeys/877a3aa2-c49a-4af1-98a6-007424e737ae
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicKeyResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
        "404":
          description: Resource Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorList'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
