            \ letter or digit. The length should be between 2-30 characters. Exceptions\
            \ - FTDv 2-14 characters; Aruba 2-24 characters."
          example: mySR
        agreeOrderTerms:
          type: boolean
          description: "To create a device, you must accept the order terms. Call\
