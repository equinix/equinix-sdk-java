components:
  schemas:
    FileUploadRequest:
      required:
        - deviceTypeCode
        - file
        - metroCode
        - processType
      type: object
      description: Request to upload a file
      properties:
        deviceManagementType:
          type: string
          description: "Device management type, whether SELF-CONFIGURED or EQUINIX-CONFIGURED"
          example: SELF-CONFIGURED
          enum:
            - SELF-CONFIGURED
            - EQUINIX-CONFIGURED
        file:
          type: string
          description: "A license or a cloud_init file."
          format: binary
          example: binary_content
        licenseType:
          type: string
          description: Type of license (BYOL-Bring Your Own License)
          example: BYOL
          enum:
            - BYOL
        metroCode:
          type: string
          description: Two-letter metro code.
          example: SV
        deviceTypeCode:
          $ref: '#/components/schemas/DeviceTypeCode'
        processType:
          type: string
          description: Whether you are uploading a license or a cloud_init file. LICENSE or CLOUD_INIT
          example: LICENSE
          enum:
            - LICENSE
            - CLOUD_INIT
    LicenseUploadRequest:
      required:
        - file
      type: object
      description: Request to upload a license file
      properties:
        file:
          type: string
          description: License file
          format: binary
          example: binary_content
    AgreementStatusResponse:
      type: object
      required:
        - isValid
      properties:
        errorMessage:
          type: string
          description: Error message if agreement is invalid
          example: "null"
        isValid:
          type: boolean
          description: Whether the agreement is valid
          example: true
        terms:
          type: string
          description: Agreement terms
          example: "null"
        termsVersionID:
          type: string
          description: Agreement terms version ID
          example: "null"
    GetDownloadableImageResponse:
      type: array
      items:
        $ref: '#/components/schemas/ListOfDownloadableImages'
    ListOfDownloadableImages:
      type: object
      description: Details of a downloadable image
      properties:
        uuid:
          type: string
          description: The unique Id of the downloadable link.
          example: 4cfb5675-5c3f-4275-adba-0c9e3c26c96b
        deviceType:
          $ref: '#/components/schemas/DeviceTypeCode'
        imageName:
          type: string
          description: Name of the image.
          example: CiscoSyst-C8000VCon-17.11.01a-3270
        version:
          type: string
          description: Device version
          example: 17.11.01a
    PostDownloadImageResponse:
      type: object
      properties:
        downloadLink:
          type: string
          description: The link to download the image
          example: https://mb2lxfsprod.equinix.com/owncloud/index.php/s/7BTqXaZbggTURBO/download
    InterfaceStatsObject:
      type: object
      properties:
        stats:
          $ref: '#/components/schemas/InterfaceStatsDetailObject'
    InterfaceStatsDetailObject:
      type: object
      description: Detailed interface statistics
      properties:
        startDateTime:
          type: string
          format: date-time
          description: Start time of the duration for which you want stats.
          example: 2023-11-10T19:06:06Z
        endDateTime:
          type: string
          format: date-time
          description: End time of the duration for which you want stats.
          example: 2023-11-17T19:06:06Z
        unit:
          type: string
          description: Unit.
          example: Mbps
        inbound:
          $ref: '#/components/schemas/InterfaceStatsofTraffic'
        outbound:
          $ref: '#/components/schemas/InterfaceStatsofTraffic'
    InterfaceStatsofTraffic:
      type: object
      description: Interface traffic statistics
      properties:
        max:
          type: number
          description: Max throughput during the time interval.
          example: 29.90603462474768
        mean:
          type: number
          description: Mean throughput during the time interval.
          example: 6.341387726453309
        lastPolled:
          type: number
          description: The throughput of the last polled data.
          example: 4.2551751570268115
        metrics:
          type: array
          description: Array of polled throughput metrics
          items:
            $ref: '#/components/schemas/PolledThroughputMetrics'
    PolledThroughputMetrics:
      type: object
      properties:
        intervalDateTime:
          type: string
          format: date-time
          description: The end of a polled time period.
          example: 2023-11-10T19:32:14Z
        mean:
          type: number
          description: Mean traffic throughput.
          example: 9.549439345514042
    DeviceRMAPostRequest:
      required:
        - version
      type: object
      properties:
        version:
          type: string
          description: Any version you want.
          example: 17.09.01a
        cloudInitFileId:
          type: string
          description: "For a C8KV device, this is the Id of the uploaded bootstrap\
            \ file. Upload your Cisco bootstrap file by calling Upload File. In the\
            \ response, you'll get a fileUuid that you can enter here as cloudInitFileId.\
            \ This field may be required for some vendors."
          example: 029a0bcd-0b2f-4bc5-b875-b506aa4b9738
        licenseFileId:
          type: string
          description: "This is the Id of the uploaded license file. For a CSR1KV\
            \ SDWAN device, upload your license file by calling Upload License File.\
            \ In the response, you'll get a fileId that you can enter here as licenseFileId.\
            \ This field may be required for some vendors."
          example: 329a0bcd-0b2f-4bc5-b875-b506aa4b9730
        token:
          type: string
          description: "License token. For a cluster, you will need to provide license\
            \ tokens for both node0 and node1. To get the exact payload for different\
            \ vendors, check the Postman script on the API Reference page of online\
            \ documentation."
          example: 897gjikk888
        vendorConfig:
          $ref: '#/components/schemas/RMAVendorConfig'
        userPublicKey:
          $ref: '#/components/schemas/UserPublicKeyRequest'
    RMAVendorConfig:
      type: object
      description: RMA vendor configuration
      properties:
        siteId:
          type: string
          description: "Physical location within the Viptela overlay network, such\
            \ as a branch office, or a campus (relevant only for Cisco SD-WANs)"
          example: "567"
        systemIpAddress:
          type: string
          description: IP assigned to the router and vSmart controller (relevant only
            for Cisco SD-WANs)
          example: 192.164.0.0
        licenseKey:
          type: string
          description: License key. Mandatory for some devices.
          example: 6735-vwe64568-6a91-4112-8734-bea12d91f7y7
        licenseSecret:
          type: string
          description: License secret (Secret key). Mandatory for some devices.
          example: h5j0i45e83324pblbfca764532c4a640e7801f0
        controller1:
          type: string
          description: "For Fortinet devices, this is the System IP address."
          example: 54.219.248.29
        adminPassword:
          type: string
          description: The administrative password of the device. You can use it to
            log in to the console. This field is not available for all device types.
            Should be at least 6 characters long and must include an uppercase letter
            and a number. This field may be required for some vendors.
          example: ZQeIDI7sUd
        activationKey:
          type: string
          description: Available on VMware Orchestration Portal
          example: GJUK-JM2X-59BJ-2TDJ
        provisioningKey:
          type: string
          description: Mandatory for Zscaler devices
          example: provisioningKeysample
        panoramaIpAddress:
          type: string
          description: IP address of the Panorama controller. Provide this value to
            have Panorama integration. Relevant for Palo Alto Self-Configured devices
            with Internet Access
          example: 1.1.1.1
        panoramaAuthKey:
          type: string
          description: This key supports secure onboarding of the Palo Alto firewall
            devices. Provide this value to have Panorama integration. Relevant for
            Palo Alto Self-Configured devices with Internet Access.
          example: "123456"
    AgreementAcceptRequest:
      type: object
      description: Request to accept an agreement
      properties:
        accountNumber:
          type: string
          description: Account number.
          example: "456446"
        apttusId:
          type: string
          description: The version number of the agreement.
          example: c2Z34000002CXRm
    AgreementAcceptResponse:
      type: object
      description: Response for agreement acceptance
      properties:
        status:
          type: string
          description: Status of the request.
          enum:
            - SUCCESS
            - FAILED
          example: "SUCCESS"
    VersionDetails:
      type: object
      description: Software version details
      properties:
        cause:
          $ref: '#/components/schemas/VersionDetails'
        version:
          type: string
          description: Version.
          example: 16.09.02
        imageName:
          type: string
          description: Image name.
          example: csr-16.09.02
        versionDateTime:
          type: string
          format: date-time
          description: The date the software was released.
          example: 2019-01-01T00:00:00Z
        retireDateTime:
          type: string
          format: date-time
          description: The date the software will no longer be available.
          example: 2024-12-12T00:00:00Z
        status:
          type: string
          description: Version status.
          enum:
            - ACTIVE
            - INACTIVE
            - RETIRED
          example: ACTIVE
        stableVersion:
          type: boolean
          description: Whether this is a stable version.
          example: true
        allowedUpgradableVersions:
          type: array
          description: List of allowed upgradable versions.
          items:
            type: string
            example: 16.09.03
        supportedLicenseTypes:
          type: array
          description: Supported license types.
          example:
            - BYOL
            - Subscription
          items:
            type: string
            enum:
              - BYOL
              - Subscription
    DeviceBackupCreateRequest:
      type: object
      description: Request to create a device backup
      required:
        - deviceUuid
        - name
      properties:
        deviceUuid:
          type: string
          description: The unique Id of a virtual device.
          example: 3da0a663-20d9-4b8f-8c5d-d5cf706840c8
        name:
          type: string
          description: The name of backup.
          example: My New Backup
    DeviceBackupUpdateRequest:
      type: object
      description: Request to update a device backup
      required:
        - name
      properties:
        name:
          type: string
          description: The name of backup.
          example: My New Backup
    SshUserCreateResponse:
      type: object
      description: Response for SSH user creation
      properties:
        uuid:
          type: string
          description: The ID of the newly created SSH user.
          example: 12828472-e6e9-4f2b-98f7-b79cf0fab4ff
    DeviceBackupInfoVerbose:
      type: object
      properties:
        uuid:
          type: string
          description: The unique Id of the device backup.
          example: 4cfb5675-5c3f-4275-adba-0c9e3c26c96b
        name:
          type: string
          description: The name of the backup.
          example: My New Backup
        version:
          type: string
          description: Version of the device
          example: 16.09.02
        type:
          type: string
          description: The type of backup.
          enum:
            - CONFIG
          example: CONFIG
        status:
          type: string
          description: The status of the backup.
          enum:
            - COMPLETED
            - FAILED
            - IN_PROGRESS
          example: COMPLETED
        createdBy:
          type: string
          description: Created by.
          example: cust0001
        lastUpdatedDateTime:
          type: string
          format: date-time
          description: Last updated date.
          example: 2018-01-30T10:30:31Z
        downloadUrl:
          type: string
          description: URL where you can download the backup.
          example: /nfv/v1/deviceBackups/02cd28c5-3e4b-44ff-ad86-bb01eb3e5863/download
        deleteAllowed:
          type: boolean
          description: Whether or not you can delete the backup.
          example: true
        restores:
          type: array
          items:
            $ref: '#/components/schemas/PreviousBackups'
        deviceUuid:
          type: string
          description: Unique Id of the device
          example: 78fb5675-5c3f-4275-adba-0c9e3c26c78c
    PreviousBackups:
      type: object
      properties:
        uuid:
          type: string
          description: The unique Id of a backup.
          example: 7hgj5675-5c3f-4275-adba-0c9e3c26c45y
        status:
          type: string
          description: The status of the backup.
          enum:
            - COMPLETED
            - FAILED
            - IN_PROGRESS
          example: COMPLETED
        createdBy:
          type: string
          description: Created by.
          example: cust0001
        createdDateTime:
          type: string
          format: date-time
          description: Created date.
          example: 2018-01-30T10:30:31Z
        lastUpdatedDateTime:
          type: string
          format: date-time
          description: Last updated date.
          example: 2018-01-30T10:30:31Z
    RestoreBackupInfoVerbose:
      type: object
      properties:
        deviceBackup:
          type: object
          properties:
            deviceBackup:
              $ref: '#/components/schemas/DeviceBackupRestore'
          description: An object that has the device backup details.
        services:
          type: object
          properties:
            serviceName:
              $ref: '#/components/schemas/ServiceInfo'
          description: An object that has the analysis of services associated with
            the backup or services added to the device since the backup.
        restoreAllowedAfterDeleteOrEdit:
          type: boolean
          description: "If True, the backup is restorable once you perform the recommended\
            \ opertions. If False, the backup is not restorable."
          example: false
    DeviceBackupRestore:
      type: object
      description: Details of a device backup for restore
      properties:
        uuid:
          type: string
          description: The unique ID of the backup.
          example: ac8a8497-1b6e-42d1-9075-acf23a62ed50
        name:
          type: string
          description: The name of the backup.
          example: My New Backup
        status:
          type: string
          description: The status of the backup.
          enum:
            - COMPLETED
            - FAILED
            - IN_PROGRESS
          example: COMPLETED
        deleteAllowed:
          type: boolean
          description: Whether you can delete the backup. Only backups in the COMPELTED
            or FAILED states can be deleted.
          example: true
    ServiceInfo:
      type: object
      description: Information about a service associated with a backup
      properties:
        serviceId:
          type: string
          description: The unique ID of the service.
          example: ac8a8497-1b6e-42d1-9075-acf23a62ed50
        serviceName:
          type: string
          description: The name of the service.
          example: L2 Connection with AWS
        operationNeededToPerform:
          type: string
          description: The operation you must perform to restore the backup successfully.
            UNSUPPORTED- You cannot restore this backup. DELETE- You need to delete
            this service to restore the backup. NONE- You do not need to change anything
            to restore the backup.
          example: DELETE
    VirtualDeviceDeleteRequest:
      type: object
      description: Request to delete a virtual device
      properties:
        deactivationKey:
          type: string
          description: "If you do not provide a deactivation key for a Palo Alto BYOL\
            \ device, you must contact your vendor to release the license."
          example: 8dfbd5ba3610234d9e550032603cc34762af140533e2c1de0111d3451d16eefd
        secondary:
          $ref: '#/components/schemas/SecondaryDeviceDeleteRequest'
    SecondaryDeviceDeleteRequest:
      type: object
      description: Request to delete a secondary virtual device
      properties:
        deactivationKey:
          type: string
          description: "Object that holds the secondary deactivation key for a redundant\
            \ device. If you do not provide a deactivation key for a Palo Alto BYOL\
            \ device, you must contact your vendor to release the license."
          example: 8dfbd5ba3610234d9e550032603cc34762af140533e2c1de0111d3451d16eefd
    VirtualDeviceCreateResponse:
      type: object
      description: Response for virtual device creation
      properties:
        uuid:
          type: string
          description: Unique ID of the created virtual device
          example: 877a3aa2-c49a-4af1-98a6-007424e737ae
    GetVirtualDeviceInterfacesResponse:
      type: array
      items:
        $ref: '#/components/schemas/InterfaceBasicInfoResponse'
    GetDevicesResponse:
      type: object
      required:
        - pagination
        - data
      properties:
        pagination:
          $ref: '#/components/schemas/PaginationResponse'
        data:
          type: array
          description: Array of available virtual devices
          items:
            $ref: '#/components/schemas/VirtualDeviceDetailsResponse'
    GetDeviceUpgradeResponse:
      type: object
      required:
        - pagination
        - data
      properties:
        pagination:
          $ref: '#/components/schemas/PaginationResponse'
        data:
          type: array
          description: Array of available upgrade history
          items:
            $ref: '#/components/schemas/DeviceUpgradeDetailsResponse'
    PingResponse:
      type: object
      properties:
        message:
          type: string
          description: Ping response message.
          example: The device is reachable.
    GetPublicKeysResponse:
      type: object
      required:
        - pagination
        - data
      properties:
        pagination:
          $ref: '#/components/schemas/PaginationResponse'
        data:
          type: array
          description: Array of available public keys
          items:
            $ref: '#/components/schemas/PublicKeyResponse'
    GetDeviceBackupsResponse:
      type: object
      required:
        - pagination
        - data
      properties:
        pagination:
          $ref: '#/components/schemas/PaginationResponse'
        data:
          type: array
          description: Array of available backups
          items:
            $ref: '#/components/schemas/DeviceBackupInfoVerbose'
    GetLinksResponse:
      type: object
      required:
        - pagination
        - data
      properties:
        pagination:
          $ref: '#/components/schemas/PaginationResponse'
        data:
          type: array
          description: Array of available links
          items:
            $ref: '#/components/schemas/DeviceLinkGroup'
    GetACLTemplateResponse:
      type: object
      required:
        - pagination
        - data
      properties:
        pagination:
          $ref: '#/components/schemas/PaginationResponse'
        data:
          type: array
          description: Array of available ACL templates
          items:
            $ref: '#/components/schemas/DeviceACLDetailsResponse'
    GetDeviceReloadResponse:
      type: object
      required:
        - pagination
        - data
      properties:
        pagination:
          $ref: '#/components/schemas/PaginationResponse'
        data:
          type: array
          description: Array of available reload history
          items:
            $ref: '#/components/schemas/DeviceRebootResponse'
    GetDeviceTypesResponse:
      type: object
      required:
        - pagination
        - data
      properties:
        pagination:
          $ref: '#/components/schemas/PaginationResponse'
        data:
          type: array
          description: Array of available virtual device types
          items:
            $ref: '#/components/schemas/VirtualDeviceType'
    SshUsers:
      type: object
